<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miami Gardens Lakefront Home</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <style>
        /* Base Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif; 
            overflow: hidden;
        }

        /* Story Container */
        .story-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            /* Using the provided lakefront aerial photo */
            background: linear-gradient(rgba(0, 50, 50, 0.3), rgba(0, 30, 30, 0.6)),
                        url('https://i.postimg.cc/zBGGX4J1/1.jpg'); 
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px 30px 70px;
        }

        /* Header */
        .header {
            text-align: center;
            z-index: 2;
            background: rgba(0, 0, 0, 0.5); 
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            border-bottom: 3px solid #00E676; /* Bright Green accent */
            animation: fadeIn 1s ease-out forwards;
        }

        .title {
            font-size: 32px;
            color: #E0F2F1; /* Very light teal */
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 5px rgba(0,0,0,1);
            font-weight: 800;
        }

        /* Central Content */
        .central-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 5;
            padding: 20px 0;
        }

        .new-badge {
            background: linear-gradient(135deg, #00C853, #64DD17); /* Green/Lime gradient */
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 6px 20px rgba(0, 200, 83, 0.6);
            animation: pulseFade 1.5s infinite alternate, bounceIn 0.8s;
            text-transform: uppercase;
        }

        .featured-price {
            font-size: 90px;
            color: #00E676; /* Bright Green Price */
            font-weight: 900;
            text-shadow: 4px 4px 10px rgba(0,0,0,0.9);
            animation: priceReveal 1.2s ease-out forwards;
            animation-delay: 0.5s;
            opacity: 0; 
            transform: scale(0.5);
        }

        .location-callout {
            font-size: 18px;
            color: #FFFFFF;
            font-weight: 600;
            text-shadow: 1px 1px 5px rgba(0,0,0,1);
            animation: slideUp 0.8s ease-out forwards;
            animation-delay: 1s;
            opacity: 0; 
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 8px;
        }
        
        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            z-index: 2;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-bottom: 4px solid #00C853; /* Green accent */
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0; 
        }

        .info-item:nth-child(1) { animation-delay: 1.5s; }
        .info-item:nth-child(2) { animation-delay: 1.7s; }
        .info-item:nth-child(3) { animation-delay: 1.9s; }
        .info-item:nth-child(4) { animation-delay: 2.1s; }

        .info-icon {
            font-size: 30px;
            margin-bottom: 8px;
            color: #00C853;
        }

        .info-value {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .info-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Buttons */
        .cta-group {
            display: flex;
            gap: 10px;
            z-index: 2;
            animation: fadeInUp 0.6s ease-out forwards;
            animation-delay: 2.3s;
            opacity: 0; 
            width: 100%;
            justify-content: space-between;
        }

        .cta-button {
            background: linear-gradient(135deg, #009688, #4DB6AC); /* Teal action color */
            color: white;
            padding: 18px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 6px 25px rgba(0, 150, 136, 0.7);
            cursor: pointer;
            transition: transform 0.3s ease;
            text-decoration: none;
            flex: 1;
        }

        .download-button {
            background: linear-gradient(135deg, #777, #555);
            color: white;
            padding: 18px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 6px 25px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.3s ease;
            text-decoration: none;
            border: none;
            white-space: nowrap;
        }
        .download-button:hover, .cta-button:hover { transform: scale(1.05); }

        /* --- Animations --- */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounceIn { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulseFade { 0% { box-shadow: 0 0 0px rgba(0, 200, 83, 0.6); } 100% { box-shadow: 0 0 20px rgba(0, 200, 83, 0.9); } }
        @keyframes priceReveal { 0% { opacity: 0; transform: scale(0.5) rotate(-3deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* === SNAPSHOT MODE === */
        body.capturing * {
            animation: none !important;
            transition: none !important;
            opacity: 1 !important;
            transform: none !important;
        }
        body.capturing .story-container {
            height: 100vh; 
            width: 100vw;
        }
    </style>
</head>
<body>
    <div class="story-container" id="capture-target">
        <div class="header">
            <h1 class="title">Serene Lakefront Living in Miami Gardens</h1>
        </div>
        
        <div class="central-content">
            <div class="new-badge">LAKEFRONT | NO HOA | SINGLE FAMILY</div>
            <div class="featured-price">$470,000</div>
            <div class="location-callout">3981 NW 201st St - Serene Water Views</div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-icon">🛏️</div>
                <div class="info-value">3 / 1.5</div>
                <div class="info-label">Beds / Baths</div>
            </div>
            <div class="info-item">
                <div class="info-icon">🌊</div>
                <div class="info-value">Lakefront</div>
                <div class="info-label">Direct Water Views</div>
            </div>
            <div class="info-item">
                <div class="info-icon">🏡</div>
                <div class="info-value">No HOA</div>
                <div class="info-label">Freedom & Privacy</div>
            </div>
            <div class="info-item">
                <div class="info-icon">📐</div>
                <div class="info-value">1,150</div>
                <div class="info-label">Living SQ FT</div>
            </div>
        </div>

        <div class="cta-group">
            <a href="https://www.compass.com/homedetails/3981-NW-201st-St-Miami-Gardens-FL-33055/1DIB3E_pid/" target="_blank" class="cta-button">
                SCHEDULE A TOUR
            </a>
            <button class="download-button" onclick="downloadImage()">
                🖼️ DOWNLOAD
            </button>
        </div>
    </div>

    <script>
        function downloadImage() {
            document.body.classList.add('capturing');
            const downloadBtn = document.querySelector('.download-button');
            downloadBtn.style.display = 'none';

            html2canvas(document.getElementById('capture-target'), {
                allowTaint: true,
                useCORS: true,
                scale: 2,
                scrollY: -window.scrollY 
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'MiamiGardens_Lakefront.png';
                link.href = canvas.toDataURL();
                link.click();

                document.body.classList.remove('capturing');
                downloadBtn.style.display = 'block';
            }).catch(err => {
                console.error(err);
                document.body.classList.remove('capturing');
                downloadBtn.style.display = 'block';
                alert("Error capturing image.");
            });
        }
    </script>
</body>
</html>
